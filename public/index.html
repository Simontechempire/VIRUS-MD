<!DOCTYPE html><html><head><title>VIRUS MD</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:monospace;text-align:center;padding:20px}.card{background:#111;border:1px solid red;padding:22px;border-radius:14px;max-width:380px;margin:auto;box-shadow:0 0 15px red}input{width:90%;padding:12px;border-radius:8px;border:1px solid #444;background:#000;color:#fff}button{width:95%;padding:12px;background:red;color:#fff;border:0;border-radius:8px;margin-top:10px;font-weight:bold}#code{font-size:28px;margin:12px;color:#0f0;letter-spacing:3px}</style></head><body><h1>VIRUS MD 🔥</h1><p>Multi Device Pair</p><p>Owner: 404 error</p><div class="card"><input id="n" placeholder="2348102350169" type="number"><button onclick="pair()">GET PAIR CODE</button><div id="code"></div><div id="i" style="font-size:12px;color:#aaa"></div></div><script>async function pair(){let v=document.getElementById('n').value;if(!v)return alert('Enter number');document.getElementById('code').innerText='...';let r=await fetch('/pair?number='+v);let d=await r.json();if(d.code){document.getElementById('code').innerText=d.code;document.getElementById('i').innerHTML='WhatsApp>Linked Devices>Link with phone number<br>Paste: <b>'+d.code+'</b><br>60s expiry'}else{document.getElementById('code').innerText=d.error}}</script></body></html>

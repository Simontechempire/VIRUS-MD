<!DOCTYPE html>
<html>
<head><title>VIRUS MD - Pair Site</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:monospace;text-align:center;padding:20px}
.card{background:#111;border:1px solid #333;padding:25px;border-radius:15px;max-width:400px;margin:auto}
input{width:90%;padding:12px;border-radius:8px;border:1px solid #444;background:#000;color:#fff;font-size:16px}
button{width:95%;padding:12px;background:#ff0000;color:#fff;border:0;border-radius:8px;margin-top:10px;font-weight:bold;font-size:16px}
#code{font-size:28px;margin:15px;color:#0f0;letter-spacing:3px}
</style>
</head>
<body>
<h1>VIRUS MD 🔥</h1>
<p>Multi Device Pair Site</p>
<p>Owner: 404 error</p>
<div class="card">
<input id="num" placeholder="Enter number e.g 2348102350169" type="number">
<button onclick="pair()">GET PAIR CODE</button>
<div id="code"></div>
<div id="info" style="font-size:12px;color:#aaa;margin-top:10px"></div>
</div>
<script>
async function pair(){
let n=document.getElementById('num').value
if(!n)return alert('Enter number')
document.getElementById('code').innerText='Generating...'
let res=await fetch('/pair?number='+n)
let data=await res.json()
if(data.code){
document.getElementById('code').innerText=data.code
document.getElementById('info').innerHTML='1. Open WhatsApp<br>2. Linked Devices<br>3. Link with phone number<br>4. Paste this code: <b>'+data.code+'</b><br><br>Code expires in 60s'
}else{
document.getElementById('code').innerText=data.error||'Failed'
}
}
</script>
</body>
</html>
